name: Publish build

on:
  push:
    branches:
      - master

jobs:
  publish:
    name: Upload build
    runs-on: ubuntu-latest
    if: contains(github.event.head_commit.message, '[ci skip]') == false

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"

      # Instala la librería desde la carpeta /libs de tu propio proyecto
      - name: Install SlimefunTranslation API
        run: |
          mvn install:install-file -Dfile=libs/SlimefunTranslation.jar -DgroupId=net.guizhanss -DartifactId=SlimefunTranslation -Dversion=v0.2.1 -Dpackaging=jar

      - name: Build with Maven
        run: mvn clean package

      - name: Upload to Blob Builds
        uses: WalshyDev/blob-builds/gh-action@main
        with:
          project: SlimeHUD
          apiToken: ${{ secrets.BLOB_BUILDS_API_TOKEN }}
          releaseNotes: ${{ github.event.head_commit.message }}
